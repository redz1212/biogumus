function check(name, label, on, hint) {
  return '<label class="check"><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '><span>' + label + (hint ? ' <span class="muted">' + hint + '</span>' : '') + '</span></label>';
}
function settingsView() {
  var s = D.settings, p = D.payment;
  return '<form class="set-form" id="fSettings">' +
    '<section class="form-card"><h2 class="h3">Оплата</h2>' +
      check('pay.card', 'Карткою онлайн', s.pay.card) + check('pay.cod', 'Накладений платіж (Нова Пошта)', s.pay.cod) +
      check('pay.iban', 'Переказ на рахунок (IBAN)', s.pay.iban, '(покупець сам переказує гроші з застосунку банку; працює без каси ПРРО)') +
      '<div class="' + (p.misconfigured ? 'warn-box' : 'info-box') + '"><b>Онлайн-оплата: ' + esc(p.label) + '</b>' +
        (p.misconfigured ? '<span>У .env вибрано сервіс оплати, але ключів немає, тому оплата працює вручну.</span>' : '') +
        '<span>Сервіс оплати (mono або LiqPay) вмикається ключами у файлі .env на сервері. Інструкція в README.md.</span></div></section>' +
    '<section class="form-card"><h2 class="h3">Доставка</h2>' +
      check('dlv.np', 'Нова Пошта, відділення або поштомат', s.dlv.np) + check('dlv.npc', 'Нова Пошта, кур’єр', s.dlv.npc) +
      check('dlv.ukr', 'Укрпошта', s.dlv.ukr) + check('dlv.local', 'Своя доставка по Борисполю й Києву', s.dlv.local) + check('dlv.self', 'Самовивіз', s.dlv.self) +
      '<div class="field"><label for="st-pickup">Адреса самовивозу</label><input class="inp" id="st-pickup" name="pickupAddress" maxlength="200" value="' + esc(s.pickupAddress) + '" placeholder="напр. м. Бориспіль, вул. …, щодня 9:00–18:00"><span class="note">Якщо порожньо, покупцю пишемо, що адресу надішлемо після підтвердження.</span></div></section>' +
    '<section class="form-card"><h2 class="h3">Суми й ціни</h2><div class="row2">' +
      '<div class="field"><label for="st-min">Мінімальна сума замовлення, грн</label><input class="inp" id="st-min" name="minOrder" type="number" min="0" step="1" value="' + s.minOrder + '"><span class="note">0 — без обмеження</span></div>' +
      '<div class="field"><label for="st-free">Безкоштовна доставка від, грн</label><input class="inp" id="st-free" name="freeDeliveryFrom" type="number" min="0" step="1" value="' + s.freeDeliveryFrom + '"><span class="note">0 — не пропонуємо</span></div></div>' +
      '<div class="field"><label for="st-opt">Оптова ціна від 1 т, грн за кг</label><input class="inp" id="st-opt" name="optPrice" type="number" min="0" step="1" value="' + (s.optPrice || 0) + '"><span class="note">Показується в блоці «Оптом». 0 — «Ціна за запитом»</span></div>' +
      '<div class="field"><label for="st-note">Примітка до цін</label><input class="inp" id="st-note" name="priceNote" maxlength="200" value="' + esc(s.priceNote) + '" placeholder="напр. Ціни вказані з ПДВ"><span class="note">Показується в кошику й у розділі «Доставка й оплата». Можна залишити порожньою.</span></div></section>' +
    '<section class="form-card"><h2 class="h3">Мова</h2>' + check('ruEnabled', 'Російська версія сайту', s.ruEnabled, '(у шапці з’явиться перемикач UA / RU; українська залишається основною)') + '</section>' +
    '<div class="cta-row"><button class="btn" type="submit">Зберегти налаштування</button></div></form>';
}

function mainView() {
  if (UI.state === 'loading') return '<div class="page"><div class="wrap"><p class="muted">Завантаження…</p></div></div>';
  if (UI.state === 'login') return loginView();
  if (UI.state === 'error') return '<div class="page"><div class="wrap"><div class="empty"><h1 class="h2">Не вдалося завантажити дані</h1><p class="muted">' + esc(UI.error) + '</p><button class="btn" data-act="refresh">Спробувати ще раз</button></div></div></div>';
  var newCnt = D.orders.filter(function (o) { return o.status === 'new'; }).length;
  var tabs = [['orders', 'Замовлення', newCnt], ['products', 'Товари й ціни', null], ['leads', 'Оптові заявки', D.leads.length], ['settings', 'Налаштування', null]];
  var body = UI.tab === 'products' ? productsView() : UI.tab === 'leads' ? leadsView() : UI.tab === 'settings' ? settingsView() : ordersView();
  return '<div class="page"><div class="wrap"><div class="adm-top"><div><p class="eyebrow">Бачить лише власник</p><h1 class="h2">Адмін-панель</h1></div></div>' +
    '<div class="tabbar" role="tablist">' + tabs.map(function (t) {
      return '<button role="tab" data-act="tab" data-k="' + t[0] + '" aria-current="' + (UI.tab === t[0]) + '">' + t[1] + (t[2] !== null ? '<span class="cnt' + (t[2] ? '' : ' cnt-0') + '">' + t[2] + '</span>' : '') + '</button>';
    }).join('') + '</div>' + body + '</div></div>';
}

function render() { app.innerHTML = header() + '<main id="main">' + mainView() + '</main>'; }

function load() {
  return EG.api('GET', '/api/admin/data').then(function (d) { D = d; UI.state = 'ready'; render(); })
    .catch(function (err) {
      if (err.status === 401) UI.state = 'login'; else { UI.state = 'error'; UI.error = err.message; }
      render();
      var p = document.getElementById('a-pass'); if (p) p.focus();
    });
}
function fail(err) {
  if (err.status === 401) { D = null; UI.state = 'login'; render(); EG.toast('Сесія завершилась, увійдіть знову'); return; }
  EG.toast(err.message);
}

/* photos */
function setPhotos(owner, photos) {
  if (owner === 'opt') D.catalog.opt.photos = photos;
  else D.catalog.products.forEach(function (p) { if (p.id === owner) p.photos = photos; });
}
function currentPhotos(owner) {
  if (owner === 'opt') return D.catalog.opt.photos;
  var p = D.catalog.products.filter(function (x) { return x.id === owner; })[0];
  return p ? p.photos : [];
}
function resizeImage(file, max) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
function addPhotos(owner, files) {
  var list = Array.prototype.slice.call(files || []);
  if (!list.length || UI.busy[owner]) return;
  var imgs = list.filter(function (f) { return /^image\//.test(f.type); });
  var room = MAXPH - currentPhotos(owner).length;
  var skipped = list.length - imgs.length;
  if (imgs.length > room) { skipped += imgs.length - room; imgs = imgs.slice(0, room); }
  if (!imgs.length) { EG.toast(room ? 'Це не зображення. Підходять JPG, PNG або WebP.' : 'Максимум ' + MAXPH + ' фото на товар'); return; }
  UI.busy[owner] = true; render();
  var added = 0, failed = 0;
  // one by one: keeps memory low on phones and keeps the order the owner chose
  imgs.reduce(function (chain, file) {
    return chain.then(function () { return resizeImage(file, 1000); }).then(function (data) {
      if (!data) { failed++; return; }
      return EG.api('POST', '/api/admin/photos', { owner: owner, data: data })
        .then(function (r) { setPhotos(owner, r.photos); added++; render(); })
        .catch(function (err) { failed++; if (err.status === 401) throw err; });
    });
  }, Promise.resolve()).then(function () {
    UI.busy[owner] = false; render();
    if (failed + skipped) EG.toast('Додано фото: ' + added + '. Не вдалося: ' + (failed + skipped) + ' (збережіть як JPG або PNG, максимум ' + MAXPH + ' фото).');
    else EG.toast(added === 1 ? 'Фото додано' : 'Додано фото: ' + added);
  }).catch(function (err) { UI.busy[owner] = false; fail(err); });
}

/* packaging edits: label, amount and unit are saved together */
function saveVariantLabel(row) {
  var id = row.getAttribute('data-vrow');
  var get = function (k) { return row.querySelector('[data-vedit="' + k + '"]').value; };
  EG.api('PATCH', '/api/admin/variants/' + encodeURIComponent(id), { label: get('label'), unit: get('unit'), amount: get('amount') })
    .then(function (v) {
      D.catalog.products.forEach(function (p) { p.variants = p.variants.map(function (x) { return x.id === v.id ? v : x; }); });
      EG.toast('Фасування збережено: ' + v.label);
    })
    .catch(function (err) { fail(err); load(); });
}

/* events */
document.addEventListener('click', function (e) {
  if (!active()) return;
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var ds = b.dataset;
  switch (ds.act) {
    case 'theme': EG.toggleTheme(); render(); break;
    case 'refresh': UI.state = D ? 'ready' : 'loading'; load().then(function () { if (UI.state === 'ready') EG.toast('Дані оновлено'); }); break;
    case 'logout':
      EG.api('POST', '/api/admin/logout').catch(function () {}).then(function () { D = null; UI.state = 'login'; render(); });
      break;
    case 'tab': UI.tab = ds.k; UI.confirm = null; render(); break;
    case 'cancel': UI.confirm = null; render(); break;
    case 'add-product': UI.addProduct = true; render(); var n = document.getElementById('np-name'); if (n) n.focus(); break;
    case 'add-product-cancel': UI.addProduct = false; render(); break;
    case 'ph-main':
      EG.api('POST', '/api/admin/photos/' + encodeURIComponent(ds.id) + '/main')
        .then(function (r) { setPhotos(r.owner, r.photos); render(); EG.toast('Головне фото змінено'); }).catch(fail);
      break;
    case 'ph-del': UI.confirm = 'ph:' + ds.id; render(); break;
    case 'ph-del-yes':
      UI.confirm = null;
      EG.api('DELETE', '/api/admin/photos/' + encodeURIComponent(ds.id))
        .then(function (r) { setPhotos(r.owner, r.photos); render(); EG.toast('Фото видалено'); }).catch(fail);
      break;
    case 'vdel': UI.confirm = 'v:' + ds.id; render(); break;
    case 'vdel-yes':
      UI.confirm = null;
      EG.api('DELETE', '/api/admin/variants/' + encodeURIComponent(ds.id))
        .then(function (r) { D.catalog = r.catalog; render(); EG.toast('Фасування видалено'); }).catch(fail);
      break;
    case 'pdel': UI.confirm = 'p:' + ds.id; render(); break;
    case 'pdel-yes':
      UI.confirm = null;
      EG.api('DELETE', '/api/admin/products/' + encodeURIComponent(ds.id))
        .then(function (r) { D.catalog = r.catalog; render(); EG.toast('Товар видалено'); }).catch(fail);
      break;
  }
});
document.addEventListener('change', function (e) {
  if (!active()) return;
  var t = e.target, ds = t.dataset;
  if (ds.upload) { addPhotos(ds.upload, t.files); t.value = ''; return; }
  if (ds.vedit) { saveVariantLabel(t.closest('[data-vrow]')); return; }
  if (ds.price) {
    var old = t.defaultValue;
    EG.api('PATCH', '/api/admin/variants/' + encodeURIComponent(ds.price), { price: Number(t.value) })
      .then(function (v) { t.defaultValue = String(v.price); t.value = v.price; EG.toast('Ціну збережено: ' + v.product_name + ', ' + v.label + ', ' + money(v.price)); })
      .catch(function (err) { t.value = old; fail(err); });
    return;
  }
  if (ds.stock) {
    EG.api('PATCH', '/api/admin/variants/' + encodeURIComponent(ds.stock), { stock: t.value })
      .then(function (v) { EG.toast(v.product_name + ', ' + v.label + ': ' + EG.STOCK[v.stock].toLowerCase()); })
      .catch(function (err) { fail(err); load(); });
    return;
  }
  if (ds.status || ds.paid) {
    var no = ds.status || ds.paid;
    var body = ds.status ? { status: t.value } : { paid: t.checked };
    EG.api('PATCH', '/api/admin/orders/' + no, body).then(function (o) {
      D.orders = D.orders.map(function (x) { return x.no === o.no ? o : x; });
      render();
      EG.toast('Замовлення №' + o.no + ': ' + (ds.status ? EG.STATUS[o.status].toLowerCase() : (o.paid ? 'оплачено' : 'не оплачено')));
    }).catch(function (err) { fail(err); load(); });
  }
});
function formData(f) { var o = {}; new FormData(f).forEach(function (v, k) { o[k] = v; }); return o; }
document.addEventListener('submit', function (e) {
  if (!active()) return;
  var f = e.target;
  e.preventDefault();
  var fd = formData(f);
  if (f.id === 'fLogin') {
    if (UI.loggingIn) return;
    if (!fd.password) { UI.loginError = 'Введіть пароль'; render(); return; }
    UI.loggingIn = true; UI.loginError = ''; render();
    EG.api('POST', '/api/admin/login', { password: fd.password })
      .then(function () { UI.loggingIn = false; UI.state = 'loading'; render(); return load(); })
      .catch(function (err) { UI.loggingIn = false; UI.loginError = err.message; render(); var p = document.getElementById('a-pass'); if (p) p.focus(); });
    return;
  }
  if (f.id === 'fSettings') {
    var s = {
      pay: { card: !!f.elements['pay.card'].checked, cod: !!f.elements['pay.cod'].checked, iban: !!f.elements['pay.iban'].checked },
      dlv: { np: f.elements['dlv.np'].checked, npc: f.elements['dlv.npc'].checked, ukr: f.elements['dlv.ukr'].checked, local: f.elements['dlv.local'].checked, self: f.elements['dlv.self'].checked },
      pickupAddress: fd.pickupAddress, minOrder: Number(fd.minOrder) || 0, freeDeliveryFrom: Number(fd.freeDeliveryFrom) || 0, optPrice: Number(fd.optPrice) || 0,
      priceNote: fd.priceNote, ruEnabled: f.elements.ruEnabled.checked
    };
    EG.api('PUT', '/api/admin/settings', s).then(function (saved) { D.settings = saved; render(); EG.toast('Налаштування збережено'); }).catch(fail);
    return;
  }
  if (f.id === 'fAddProduct') {
    EG.api('POST', '/api/admin/products', {
      name: fd.name, tagline: fd.tagline, cat: fd.cat, art: fd.art,
      variant: { label: fd.label, unit: fd.unit, amount: fd.amount, price: fd.price }
    }).then(function (r) { D.catalog = r.catalog; UI.addProduct = false; render(); EG.toast('Товар створено. Додайте фото й опис нижче.'); }).catch(fail);
    return;
  }
  if (f.dataset.addvar) {
    EG.api('POST', '/api/admin/products/' + encodeURIComponent(f.dataset.addvar) + '/variants', { label: fd.label, unit: fd.unit, amount: fd.amount, price: fd.price })
      .then(function (r) { D.catalog = r.catalog; render(); EG.toast('Фасування додано'); }).catch(fail);
    return;
  }
  if (f.dataset.prod) {
    var id = f.dataset.prod;
    EG.api('PATCH', '/api/admin/products/' + encodeURIComponent(id), fd).then(function () {
      D.catalog.products.forEach(function (p) { if (p.id === id) { for (var k in fd) p[k] = String(fd[k]).trim(); } });
      render(); EG.toast('Тексти збережено');
    }).catch(fail);
  }
});
function dropZone(e) { return active() && e.target && e.target.closest ? e.target.closest('[data-drop]') : null; }
document.addEventListener('dragover', function (e) { var z = dropZone(e); if (z) { e.preventDefault(); z.classList.add('drag'); } });
document.addEventListener('dragleave', function (e) { var z = dropZone(e); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
document.addEventListener('drop', function (e) { var z = dropZone(e); if (z) { e.preventDefault(); z.classList.remove('drag'); addPhotos(z.getAttribute('data-drop'), e.dataTransfer.files); } });

function start() { render(); return load(); }
if (window.EG_MOCK) window.EG_ADMIN = { start: start }; else start();
})();

</script>
<script>
/* Demo bar of maket.html: switches between the shop, the admin panel and the owner's Telegram view. */
(function () {
'use strict';
var EG = window.EG, esc = EG.esc;
var bar = document.getElementById('demo'), app = document.getElementById('app');

function btn(mode, label) {
  return '<button data-demo="' + mode + '" aria-current="' + (window.EG_MODE === mode) + '">' + label + '</button>';
}
function renderBar() {
  bar.innerHTML = '<div class="wrap demo-in"><span><b>Демо-макет</b> · ціни й фото поки приклад, усе зберігається лише у вашому браузері</span>' +
    '<nav class="demo-nav" aria-label="Режими макета">' + btn('shop', 'Сайт') + btn('admin', 'Адмін-панель') + btn('tg', 'Telegram власника') +
    '<button data-demo="reset">Скинути демо</button></nav></div>';
}
function renderTg() {
  var list = window.MAKET_DB.tg();
  app.innerHTML = '<main id="main"><div class="page"><div class="wrap" style="display:grid;gap:18px;max-width:640px">' +
    '<div><p class="eyebrow">Сповіщення</p><h1 class="h2">Telegram власника</h1></div>' +
    '<p class="lead">Так бот надсилає власнику кожне нове замовлення й оптову заявку. Оформіть замовлення на сайті, і тут з’явиться нове повідомлення.</p>' +
    '<div class="tg"><div class="tg-head"><span class="tg-ava"><img src="' + esc(window.EG_LOGO_SRC) + '" alt="" width="36" height="36" style="border-radius:50%;display:block"></span><div><b>Ecogreen Замовлення</b><small>бот</small></div></div>' +
    (list.length ? list.map(function (m) {
      return '<div class="tg-msg">' + esc(m.text) + '<span class="tg-time">' + esc(EG.fmtDate(m.at).slice(-5)) + '</span></div>';
    }).join('') : '<p class="muted">Повідомлень ще немає.</p>') +
    '</div></div></div></main>';
}
function setMode(mode) {
  window.EG_MODE = mode;
  renderBar();
  window.scrollTo(0, 0);
  if (mode === 'admin') window.EG_ADMIN.start();
  else if (mode === 'tg') renderTg();
  else window.EG_SHOP.start();
}

bar.addEventListener('click', function (e) {
  var b = e.target.closest('[data-demo]');
  if (!b) return;
  if (b.dataset.demo === 'reset') {
    window.MAKET_DB.reset();
    setMode(window.EG_MODE);
    EG.toast('Демо повернуто до початкових даних. Завантажені фото залишились.');
    return;
  }
  setMode(b.dataset.demo);
});

// Links in the admin panel point to real site pages ("/", "/product/dry"); in the demo they open the shop view.
document.addEventListener('click', function (e) {
  if (window.EG_MODE !== 'admin') return;
  var a = e.target.closest('a[href^="/"]');
  if (!a) return;
  e.preventDefault();
  e.stopPropagation();
  var href = a.getAttribute('href');
  setMode('shop');
  if (href !== '/') window.EG_SHOP.go(href);
}, true);

setMode('shop');
if (!window.MAKET_DB.storageOk) EG.toast('Браузер не зберігає дані: після перезавантаження демо почнеться спочатку.');
})();

</script>
