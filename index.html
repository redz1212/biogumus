<title>Макет Ecogreen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- demo only: keep it out of search, the real site will be on its own domain -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Ecogreen styles. Colors are tokens in :root; dark theme redefines them below. */
/* Layout: soil-profile bands. Pale sage page, a light band for instructions, dark humus bands for wholesale and footer. */
:root{
  --bg:#F1F3EC; --surface:#FFFFFF; --surface-2:#E5E9DE; --ink:#241C16; --muted:#5B6057; --line:#D2D7C9;
  --leaf:#24613B; --leaf-hover:#1B4C2E; --on-leaf:#FFFFFF; --sprout:#B7D45C; --gold:#86682C; --gold-band:#D4B46E; --logo-light:block; --logo-dark:none;
  --soil:#2A211B; --on-soil:#EEE9E0; --on-soil-muted:#B9AF9F; --soil-line:#43372D;
  --kraft:#CFAE80; --kraft-dark:#AD8958; --label:#FBFAF6; --label-ink:#2A211B; --pack-green:#2A6A40;
  --liquid:#3B2A1E; --worm:#C8766A; --sack:#ECE8DD; --root:#EADCC3; --on-illus:#F4ECDD;
  --l1:#3B2A1F; --l2:#6A4C35; --l3:#86664A; --sky:#DCE6D2;
  --ok:#2A6B3E; --ok-bg:#DDEDD9; --warn:#8A5810; --warn-bg:#F5E7CB; --no:#9C3A30; --no-bg:#F5DEDA;
  --tg:#2AABEE; --on-tg:#FFFFFF; --tg-bg:#D6E3EC; --tg-bubble:#FFFFFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14120F; --surface:#1C1915; --surface-2:#25211C; --ink:#ECE7DE; --muted:#A39C90; --line:#38312A;
  --leaf:#74BF88; --leaf-hover:#8FCDA0; --on-leaf:#0E1A11; --sprout:#C6DF72; --gold:#D4B46E; --gold-band:#D4B46E; --logo-light:none; --logo-dark:block;
  --soil:#0C0A08; --on-soil:#ECE7DE; --on-soil-muted:#A39C90; --soil-line:#2E2822;
  --kraft:#BF9D6F; --kraft-dark:#9C7B4F; --label:#F1EDE4; --label-ink:#2A211B; --pack-green:#3F8F58;
  --liquid:#2E2118; --worm:#D08C80; --sack:#DAD5C9; --root:#E2D3B8; --on-illus:#F4ECDD;
  --l1:#3B2A1F; --l2:#634732; --l3:#806146; --sky:#1D271F;
  --ok:#83CF95; --ok-bg:#1B2C1F; --warn:#E6B25C; --warn-bg:#33281A; --no:#EA9086; --no-bg:#3A201D;
  --tg:#2AABEE; --on-tg:#FFFFFF; --tg-bg:#0F1820; --tg-bubble:#1F2B35;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1C1915; --surface-2:#25211C; --ink:#ECE7DE; --muted:#A39C90; --line:#38312A;
  --leaf:#74BF88; --leaf-hover:#8FCDA0; --on-leaf:#0E1A11; --sprout:#C6DF72; --gold:#D4B46E; --gold-band:#D4B46E; --logo-light:none; --logo-dark:block;
  --soil:#0C0A08; --on-soil:#ECE7DE; --on-soil-muted:#A39C90; --soil-line:#2E2822;
  --kraft:#BF9D6F; --kraft-dark:#9C7B4F; --label:#F1EDE4; --label-ink:#2A211B; --pack-green:#3F8F58;
  --liquid:#2E2118; --worm:#D08C80; --sack:#DAD5C9; --root:#E2D3B8; --on-illus:#F4ECDD;
  --l1:#3B2A1F; --l2:#634732; --l3:#806146; --sky:#1D271F;
  --ok:#83CF95; --ok-bg:#1B2C1F; --warn:#E6B25C; --warn-bg:#33281A; --no:#EA9086; --no-bg:#3A201D;
  --tg:#2AABEE; --on-tg:#FFFFFF; --tg-bg:#0F1820; --tg-bubble:#1F2B35;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-0.01em}
.h1{font-size:clamp(30px,4.4vw,48px)}
h2,.h2{font-size:clamp(24px,3vw,34px)}
h3,.h3{font-size:19px;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf)}
.lead{font-size:18px;color:var(--muted);max-width:56ch}
.note{font-size:14px;color:var(--muted)}
.mb{margin-bottom:24px}
:focus-visible{outline:3px solid var(--sprout);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--leaf);background:var(--leaf);color:var(--on-leaf);font:700 15px/1.1 var(--f-body);text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s;text-align:center}
.btn:hover{background:var(--leaf-hover);border-color:var(--leaf-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:transparent;border-color:var(--ink)}
.band .opt-txt .btn-ghost{color:var(--on-soil);border-color:var(--soil-line)}
.btn-sm{min-height:38px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* demo bar + header */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo-in{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding-block:7px}
.demo-nav{display:flex;flex-wrap:wrap;gap:4px}
.demo-nav a{text-decoration:none;padding:3px 10px;border-radius:999px;border:1px solid transparent;font-weight:600}
.demo-nav a[aria-current="true"]{border-color:currentColor}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;min-height:104px;position:relative}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 19px/1 var(--f-display);white-space:nowrap}
.logo-img{width:88px;height:88px;flex:none;border-radius:50%}
.logo-on-light{display:var(--logo-light)}
.logo-on-dark{display:var(--logo-dark)}
.foot .logo-on-light{display:none}
.foot .logo-on-dark{display:block}
.logo-txt b{font:700 24px/1 var(--f-display);color:var(--leaf);letter-spacing:.01em}
.foot .logo-txt b{color:var(--on-soil)}
.foot-brand .logo-img{width:110px;height:110px}
.lg-bg{fill:var(--leaf)} .lg-fg{fill:var(--on-leaf)} .lg-st{fill:none;stroke:var(--on-leaf);stroke-width:2;stroke-linecap:round}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover,.nav a[aria-current="true"]{background:var(--surface-2)}
.hdr-act{display:flex;gap:6px;align-items:center}
.push{margin-left:auto}
.icon-btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:600 14px/1 var(--f-body);cursor:pointer}
.icon-btn svg{width:18px;height:18px;flex:none}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--leaf);color:var(--on-leaf);font-size:12px;font-weight:800;display:grid;place-items:center}
.menu-btn{display:none}
@media (max-width:940px){
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px 16px;margin:0}
  .nav.open{display:flex}
  .menu-btn{display:inline-flex}
  .hdr-act{margin-left:auto}
}
@media (max-width:560px){.hide-sm{display:none}.icon-btn{padding:0 11px}.logo-txt b{font-size:19px}}
@media (max-width:420px){
  .wrap{padding-inline:16px}
  .hdr-in{gap:10px}
  .hdr-act{gap:4px}
  .icon-btn{padding:0 9px}
  .logo{gap:8px}
  .logo-img{width:64px;height:64px}
  .logo-txt b{font-size:17px}
  .chip{font-size:14px;min-height:38px}
  .demo{font-size:12px}
}

/* hero */
.hero{padding-block:48px 56px}
.hero-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
.hero-txt{display:grid;gap:22px;justify-items:start}
.hero-art{margin:0;display:grid;gap:10px;max-width:440px;justify-self:end;width:100%}
.hero-art svg{width:100%;height:auto;border-radius:8px;background:var(--sky);display:block}
.hero-art figcaption{font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero-in{grid-template-columns:1fr;gap:32px}.hero{padding-block:32px 40px}.hero-art{justify-self:start}}
.s-l1{fill:var(--l1)} .s-l2{fill:var(--l2)} .s-l3{fill:var(--l3)}
.s-grain{fill:var(--kraft);opacity:.45} .s-pebble{fill:var(--kraft);opacity:.3}
.s-stem{fill:none;stroke:var(--pack-green);stroke-width:5;stroke-linecap:round}
.s-leaf{fill:var(--pack-green)} .s-leaf2{fill:var(--sprout)}
.s-root{fill:none;stroke:var(--root);stroke-width:2;stroke-linecap:round;opacity:.75}
.s-lab{fill:var(--on-illus);font:700 13px var(--f-body)} .s-sub{fill:var(--on-illus);opacity:.75;font:500 11px var(--f-body)}

/* facts */
.facts{border-block:1px solid var(--line)}
.facts-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-block:22px}
.facts-in>div{display:grid;gap:2px;align-content:start}
.facts b{font-family:var(--f-display);font-weight:500;font-size:16px}
.facts span{font-size:14px;color:var(--muted)}
@media (max-width:860px){.facts-in{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections */
.sec{padding-block:64px;scroll-margin-top:120px}
.sec-alt{background:var(--surface-2)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 32px;margin-bottom:28px}
.sec-head>div{display:grid;gap:8px}
.sec-head>p{max-width:48ch}
@media (max-width:560px){.sec{padding-block:44px}}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.pcard-art{display:block;background:var(--surface-2);aspect-ratio:1/.82}
.sec-alt .pcard-art{background:var(--bg)}
.pcard-art svg{width:100%;height:100%;display:block}
.pcard-body{display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;flex:1}
.pcard h3 a{text-decoration:none}
.pcard h3 a:hover{text-decoration:underline}
.pcard-buy{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.price{font:800 22px/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.price-sm{font-size:16px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px/1 var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-in{background:var(--ok-bg);color:var(--ok)} .pill-order{background:var(--warn-bg);color:var(--warn)}
.pill-out{background:var(--no-bg);color:var(--no)} .pill-muted{background:var(--surface-2);color:var(--muted)}
.a-shadow{fill:var(--ink);opacity:.08}
.a-kraft{fill:var(--kraft)} .a-kraft-d{fill:var(--kraft-dark)}
.a-label{fill:var(--label)} .a-label-b{fill:var(--label);stroke:var(--kraft-dark);stroke-width:1.5}
.a-t1{fill:var(--label-ink);font:700 10px var(--f-display)} .a-t2{fill:var(--label-ink);font:800 19px var(--f-body)}
.a-green{fill:var(--pack-green)} .a-stem{fill:none;stroke:var(--pack-green);stroke-width:2;stroke-linecap:round}
.a-cap{fill:var(--pack-green)} .a-liquid{fill:var(--liquid)}
.a-shine{fill:none;stroke:var(--label);stroke-width:4;stroke-linecap:round;opacity:.25}
.a-soil{fill:var(--l1)} .a-worm{fill:none;stroke:var(--worm);stroke-width:5;stroke-linecap:round}
.a-tub{fill:var(--label);fill-opacity:.3;stroke:var(--kraft-dark);stroke-width:2}
.a-sack{fill:var(--sack)} .a-weave{stroke:var(--kraft-dark);stroke-width:1;opacity:.35} .a-strap{fill:none;stroke:var(--kraft-dark);stroke-width:6;stroke-linecap:round}

/* tables */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
.tbl-wrap table{min-width:600px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.nrm{font-weight:700}
.use-stack{display:grid;gap:16px}

/* wholesale band */
.band{background:var(--soil);color:var(--on-soil)}
.band .opt-txt .muted{color:var(--on-soil-muted)}
.band .opt-txt .eyebrow{color:var(--gold-band)}
.opt-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.opt-txt{display:grid;gap:18px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{width:20px;height:20px;flex:none;color:var(--gold-band);margin-top:2px}
@media (max-width:860px){.opt-in{grid-template-columns:1fr;gap:28px}}

/* forms */
.form-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px;min-width:0}
.field{display:grid;gap:6px;min-width:0}
.field label,.field-label{font-size:14px;font-weight:700}
.inp{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 16px/1.3 var(--f-body)}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid var(--leaf);outline-offset:0;border-color:var(--leaf)}
.inp[readonly]{background:var(--surface-2)}
.inp[aria-invalid="true"]{border-color:var(--no)}
.inp-sm{min-height:38px;padding:6px 10px;font-size:15px;width:auto;min-width:110px}
.err{font-size:13px;font-weight:600;color:var(--no)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt-radio{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt-radio:has(input:checked){border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.opt-radio input{accent-color:var(--leaf);margin-top:4px;flex:none}
.opt-radio small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--leaf)}
.ok-box{background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:16px 18px;display:grid;gap:4px}

/* delivery + faq */
.dp{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.dp h3{margin-bottom:14px}
.dl{display:grid;gap:0;margin:0;border-top:1px solid var(--line)}
.dl div{display:grid;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.dl dt{font-weight:700} .dl dd{margin:0;color:var(--muted)}
@media (max-width:760px){.dp{grid-template-columns:1fr;gap:32px}}
.faq{border-top:1px solid var(--line);max-width:860px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-display);color:var(--leaf);flex:none}
.faq details[open] summary::after{content:"−"}
.faq p{margin-top:10px;color:var(--muted);max-width:70ch}

/* footer */
.foot{background:var(--soil);color:var(--on-soil);padding-block:48px 28px;scroll-margin-top:120px}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px}
.foot-brand{display:grid;gap:12px;align-content:start}
.foot-brand p{color:var(--on-soil-muted);font-size:14px;max-width:32ch}
.foot h4{font:500 13px/1.2 var(--f-display);margin:0 0 12px;color:var(--gold-band);letter-spacing:.02em}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.foot a{text-decoration:none;color:var(--on-soil)}
.foot a:hover{text-decoration:underline}
.foot .ph{font-variant-numeric:tabular-nums}
.foot .soon{font-size:12px;color:var(--on-soil-muted)}
.foot-bottom{margin-top:36px;padding-top:18px;border-top:1px solid var(--soil-line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:13px;color:var(--on-soil-muted)}
.foot-bottom a{color:var(--on-soil-muted)}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-grid{grid-template-columns:1fr}}

/* inner pages */
.page{padding-block:28px 72px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.pp-art{background:var(--surface-2);border-radius:8px;aspect-ratio:1/1;max-width:100%}
.pp-art svg{width:100%;height:100%;display:block}
.pp-info{display:grid;gap:18px;justify-items:start}
.pp-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pp-price .price{font-size:34px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:42px;height:44px;border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;border-radius:999px}
.stepper output{min-width:30px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.stepper-sm button{width:36px;height:36px;font-size:18px}
.perks{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:var(--muted);font-size:15px}
.perks li{display:flex;gap:8px;align-items:center}
.perks svg{width:18px;height:18px;flex:none;color:var(--leaf)}
.pp-more{margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:48px;align-items:start}
.pp-more section{display:grid;gap:14px;min-width:0}
.spec{display:grid;margin:0;border-top:1px solid var(--line)}
.spec div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--muted)} .spec dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:860px){.pp{grid-template-columns:1fr;gap:24px}.pp-art{max-width:420px;width:100%}.pp-more{grid-template-columns:1fr;gap:36px;margin-top:40px}}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:12px}

.steps-row li span{color:var(--muted)}
@media (max-width:860px){.steps-row{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps-row{grid-template-columns:1fr}}

/* cart + checkout */
.cart-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.cl{display:grid;grid-template-columns:76px minmax(0,1fr) auto 100px 36px;grid-template-areas:"art info qty sum rm";gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.cl:first-child{border-top:1px solid var(--line)}
.cl-art{grid-area:art;width:76px;height:76px;background:var(--surface-2);border-radius:6px;display:block}
.cl-art svg{width:100%;height:100%;display:block}
.cl-info{grid-area:info;display:grid;gap:4px;justify-items:start;min-width:0}
.cl-info a{text-decoration:none}
.cl-qty{grid-area:qty}
.cl-sum{grid-area:sum;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rm{grid-area:rm;border:0;background:none;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.rm:hover{background:var(--surface-2);color:var(--ink)}
.rm svg{width:18px;height:18px}
@media (max-width:600px){.cl{grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"art info rm" "art qty sum";gap:10px 14px}.cl-art{width:64px;height:64px}.cl-qty{justify-self:start}}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:12px;position:sticky;top:calc(124px + env(safe-area-inset-top,0px));min-width:0}
.sum-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum-row .num{font-weight:700}
.sum-total{font-size:20px;font-weight:800;padding-top:12px;border-top:1px solid var(--line)}
.sum-lines{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.sum-lines li{display:flex;justify-content:space-between;gap:12px}

.co-sec{display:grid;gap:14px;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.co-sec:last-child{border-bottom:0;margin-bottom:0}
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line);border-radius:8px;display:grid;gap:14px;justify-items:center}
.pay{max-width:600px;display:grid;gap:20px}

.pay-marks{display:flex;flex-wrap:wrap;gap:6px}

<script>
/* Helpers shared by the shop (app.js) and the admin panel (admin.js). Everything lives in window.EG. */
(function (w) {
'use strict';
var EG = w.EG = {};

EG.STOCK = { in: 'В наявності', order: 'Під замовлення', out: 'Немає в наявності' };
EG.STATUS = { new: 'Нове', confirmed: 'Підтверджено', sent: 'Відправлено', done: 'Доставлено', cancel: 'Скасовано' };

EG.PAY = { card: 'Карткою онлайн', cod: 'Накладений платіж', iban: 'Переказ на рахунок' };

EG.esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
EG.money = function (n) { return Math.round(n).toLocaleString('uk-UA') + ' грн'; };
EG.digits = function (s) { return String(s || '').replace(/\D/g, ''); };
EG.fmtDate = function (iso) {
  var d = new Date(iso);
  if (isNaN(d)) return String(iso || '');
  return d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
};
EG.pill = function (kind, text) { return '<span class="pill pill-' + kind + '">' + (text || EG.STOCK[kind]) + '</span>'; };

/* storage that never throws (private mode, blocked cookies) */
EG.load = function (key, fallback) {
  try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
};
EG.save = function (key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ } };

/* JSON API: throws Error with the server's message, .status and .fields */
EG.api = function (method, url, body) {
  var opts = { method: method, headers: {}, credentials: 'same-origin' };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok) {
        var err = new Error(data.error || 'Помилка ' + res.status + '. Спробуйте ще раз.');
        err.status = res.status; err.fields = data.fields; err.code = data.code;
        throw err;
      }
      return data;
    });
  }, function () {
    var err = new Error('Немає зв’язку з сервером. Перевірте інтернет і спробуйте ще раз.');

  });

};
/* logo: the client's round emblem (public/img, made from brand/logo-original.webp) plus the name as text */
// two versions: on white for the light theme, without the white circle for the dark theme (CSS shows one)
EG.BRAND = '<img class="logo-img logo-on-light" src="' + (w.EG_LOGO_SRC || '/img/logo-192.webp') + '" alt="" width="88" height="88">' +
  '<img class="logo-img logo-on-dark" src="' + (w.EG_LOGO_DARK_SRC || '/img/logo-dark-192.webp') + '" alt="" width="88" height="88">' +
  '<span class="logo-txt"><b>Ecogreen</b></span>';

/* theme toggle: remembered choice, otherwise the phone/PC setting */
EG.THEME_KEY = 'ecogreen-theme';
EG.curTheme = function () {
  var t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return w.matchMedia && w.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
};
EG.themeBtn = function () {
  var d = EG.curTheme() === 'dark';
  return '<button class="icon-btn" data-act="theme" aria-label="' + (d ? 'Увімкнути світлу тему' : 'Увімкнути темну тему') + '" title="' + (d ? 'Світла тема' : 'Темна тема') + '">' +
    (d ? EG.I.sun : EG.I.moon) + '<span class="hide-sm">' + (d ? 'Світла' : 'Темна') + '</span></button>';
};
EG.toggleTheme = function () {
  var next = EG.curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(EG.THEME_KEY, next); } catch (e) { /* ignore */ }
};

/* toast with an optional action button */
var toastTimer;
EG.toast = function (msg, label, fn) {
  var el = document.getElementById('toast');
  el.textContent = '';
  var s = document.createElement('span'); s.textContent = msg; el.appendChild(s);
  if (label) {
    var b = document.createElement('button');
    b.className = 'toast-btn'; b.textContent = label;
    b.onclick = function () { el.hidden = true; fn(); };
    el.appendChild(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, label ? 6000 : 3000);
};

/* drawn packaging, shown until the owner uploads real photos */
function sprout(x, y, s) { return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><path class="a-stem" d="M0 12V2"/><path class="a-green" d="M0 8C-7 8-11 3-11-4C-4-4 0 1 0 8Z"/><path class="a-green" d="M0 4C0-3 4-8 11-8C11-1 7 4 0 4Z"/></g>'; }

<script>
/* Demo backend for maket.html: answers the same EG.api calls as server/index.js,
   but keeps everything in the visitor's browser (localStorage). Rules mirror the real server. */
(function () {
'use strict';
var EG = window.EG, M = window.MAKET;
var KEY = 'eg-maket-db-v2', MAX_PHOTOS = 8;
var DLV = ['np', 'npc', 'ukr', 'local', 'self'], PAY = ['card', 'cod', 'iban'], VOLUMES = ['1 т', '2–5 т', '5–10 т', 'понад 10 т'];
var storageOk = (function () { try { localStorage.setItem('eg-probe', '1'); localStorage.removeItem('eg-probe'); return true; } catch (e) { return false; } })();
var db = null;

function clone(x) { return JSON.parse(JSON.stringify(x)); }
function fresh() {
  var d = {
    v: 3, nextOrder: 1003, nextLead: 2, loggedIn: true, photos: {}, tg: [],
    settings: { pay: { card: false, cod: false, iban: true }, dlv: { np: true, npc: false, ukr: false, local: true, self: true }, pickupAddress: 'м. Бориспіль, вул. Завокзальна, 18', minOrder: 0, freeDeliveryFrom: 0, optPrice: 9, priceNote: '', ruEnabled: false },
    products: M.seed.map(function (p) {
      return { id: p.id, cat: p.cat, art: p.art, name: p.name, tagline: p.tagline, description: p.description, name_ru: '', tagline_ru: '', description_ru: '',
        variants: p.variants.map(function (v) {
          return { id: v.id, label: v.label, short: v.short || null, kg: v.kg || null, liters: v.liters || null, pcs: v.pcs || null, price: v.price, stock: v.stock || 'in' };
        }) };
    }),
    orders: [
      { no: 1002, created_at: '2026-09-29T15:40:00Z', name: 'Андрій П. (приклад)', phone: '+380 50 000 00 02', dlv: 'np', city: 'Полтава', branch: 'Відділення №7',
        pay: 'iban', paid: true, comment: '', status: 'sent', total: 475,
        items: [{ vid: 'liq-05', name: 'Біогумус рідкий', label: '0,5 л', price: 95, qty: 3 }, { vid: 'dry-5', name: 'Біогумус сухий', label: '5 кг', price: 190, qty: 1 }] },
      { no: 1001, created_at: '2026-09-24T07:15:00Z', name: 'Олена К. (приклад)', phone: '+380 67 000 00 01', dlv: 'np', city: 'Київ', branch: 'Відділення №25',
        pay: 'iban', paid: true, comment: '', status: 'done', total: 380,
        items: [{ vid: 'dry-5', name: 'Біогумус сухий', label: '5 кг', price: 190, qty: 2 }] }
    ],
    leads: [{ id: 1, created_at: '2026-09-28T06:05:00Z', name: 'Фермерське господарство (приклад)', phone: '+380 97 000 00 03', volume: '5–10 т', region: 'Полтавська обл.', comment: 'Потрібна доставка до господарства' }]
  };
  d.tg = d.orders.slice().reverse().map(function (o) { return { at: o.created_at, text: M.messages.orderMessage(o) }; })
    .concat(d.leads.map(function (l) { return { at: l.created_at, text: M.messages.leadMessage(l) }; }));
  return d;
}
function load() {
  if (db) return db;
  var saved = null;
  if (storageOk) { try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; } }
  db = saved && saved.v === 3 ? saved : fresh();
  return db;
}
function save() {
  if (!storageOk) return true;
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; } catch (e) { return false; }
}
function fail(status, msg, extra) {
  var e = new Error(msg); e.status = status;
  if (extra) { e.fields = extra.fields; e.code = extra.code; }
  throw e;
}
function text(v, max) { return typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, max) : ''; }
function phoneOk(p) { var d = p.replace(/\D/g, ''); return d.length >= 10 && d.length <= 15; }
function findV(vid) {
  for (var i = 0; i < db.products.length; i++) {
    var p = db.products[i];
    for (var j = 0; j < p.variants.length; j++) if (p.variants[j].id === vid) return { p: p, v: p.variants[j] };
  }
  return null;
}
function catalog() {
  return {
    products: db.products.map(function (p) { var c = clone(p); c.photos = db.photos[p.id] || []; return c; }),
    opt: { photos: db.photos.opt || [] },
    settings: clone(db.settings),
    payment: { provider: 'manual' }
  };
}
function pushTg(msg) { db.tg.push({ at: new Date().toISOString(), text: msg }); if (db.tg.length > 40) db.tg.shift(); }

function createOrder(b) {
  var o = { name: text(b.name, 80), phone: text(b.phone, 25), dlv: b.dlv, pay: b.pay, city: text(b.city, 80), branch: text(b.branch, 120), comment: text(b.comment, 500) };
  var fields = {};
  if (!o.name) fields.name = 'Вкажіть ім’я та прізвище';
  if (!phoneOk(o.phone)) fields.phone = 'Вкажіть номер у форматі +380 XX XXX XX XX';
  if (DLV.indexOf(o.dlv) < 0 || !db.settings.dlv[o.dlv]) fields.dlv = 'Оберіть спосіб доставки';
  if (PAY.indexOf(o.pay) < 0 || !db.settings.pay[o.pay]) fields.pay = 'Оберіть спосіб оплати';
  if (o.dlv === 'self') { o.city = ''; o.branch = ''; } else {
    if (!o.city) fields.city = 'Вкажіть місто';
    if (!o.branch) fields.branch = o.dlv === 'np' ? 'Вкажіть номер відділення або поштомату' : 'Вкажіть адресу';
  }
  if (Object.keys(fields).length) fail(400, 'Перевірте поля форми', { fields: fields });
  var items = [];
  (Array.isArray(b.items) ? b.items.slice(0, 30) : []).forEach(function (it) {
    var qty = Math.floor(Number(it && it.qty));
    if (!(qty >= 1 && qty <= 99)) return;
    var f = findV(it.vid);
    if (!f) fail(409, 'Деяких товарів уже немає в каталозі. Кошик оновлено, перевірте його.', { code: 'stale' });
    if (f.v.stock === 'out') fail(409, f.p.name + ', ' + f.v.label + ': немає в наявності. Приберіть його з кошика.', { code: 'out' });
    items.push({ vid: f.v.id, name: f.p.name, label: f.v.label, price: f.v.price, qty: qty });
  });
  if (!items.length) fail(400, 'Кошик порожній');
  o.items = items;
  o.total = items.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  if (db.settings.minOrder > 0 && o.total < db.settings.minOrder) fail(400, 'Мінімальна сума замовлення ' + EG.money(db.settings.minOrder) + '. Додайте ще товарів.', { code: 'min' });
  o.no = db.nextOrder++; o.created_at = new Date().toISOString(); o.paid = false; o.status = 'new'; o.token = 'demo'; o.payUrl = null;
  db.orders.unshift(o);
  pushTg(M.messages.orderMessage(o));
  save();
  return o;
}
function createLead(b) {
  var l = { name: text(b.name, 80), phone: text(b.phone, 25), volume: VOLUMES.indexOf(b.volume) >= 0 ? b.volume : VOLUMES[0], region: text(b.region, 80), comment: text(b.comment, 500) };
  if (!l.name || !phoneOk(l.phone)) fail(400, 'Вкажіть ім’я і телефон, щоб менеджер міг з вами зв’язатися.');
  l.id = db.nextLead++; l.created_at = new Date().toISOString();
  db.leads.unshift(l);
  pushTg(M.messages.leadMessage(l));
  save();
  return l;
}

function variantFrom(b) {
  var label = text(b.label, 40); if (!label) fail(400, 'Вкажіть назву фасування, наприклад «5 кг»');
  var price = Math.round(Number(b.price)); if (!(price >= 1 && price <= 1000000)) fail(400, 'Ціна має бути від 1 до 1 000 000 грн');
  var amount = Number(b.amount) > 0 ? Number(b.amount) : null;
  return { label: label, short: null, kg: b.unit === 'kg' ? amount : null, liters: b.unit === 'l' ? amount : null, pcs: b.unit === 'pcs' ? amount : null, price: price, stock: 'in' };
}

function handle(method, url, b) {
  load();
  var m;
  if (method === 'GET' && url === '/api/catalog') return catalog();
  if (method === 'POST' && url === '/api/orders') return createOrder(b);
  if (method === 'POST' && url === '/api/leads') return createLead(b);
  if (url.indexOf('/api/admin/') !== 0) fail(404, 'Не знайдено');

  if (url === '/api/admin/login') { if (!String(b.password || '')) fail(401, 'Введіть пароль'); db.loggedIn = true; save(); return { ok: true }; }
  if (url === '/api/admin/logout') { db.loggedIn = false; save(); return { ok: true }; }
  if (!db.loggedIn) fail(401, 'Потрібно увійти в адмінку');
  if (method === 'GET' && url === '/api/admin/data') return { catalog: catalog(), orders: db.orders, leads: db.leads, settings: clone(db.settings), payment: { provider: 'manual', label: 'Вручну: менеджер надсилає покупцю посилання на оплату', misconfigured: false } };
  if (method === 'PUT' && url === '/api/admin/settings') {
    var st = { pay: { card: !!(b.pay && b.pay.card), cod: !!(b.pay && b.pay.cod), iban: !!(b.pay && b.pay.iban) }, dlv: {}, pickupAddress: text(b.pickupAddress, 200),
      minOrder: Math.max(0, Math.round(Number(b.minOrder) || 0)), freeDeliveryFrom: Math.max(0, Math.round(Number(b.freeDeliveryFrom) || 0)), optPrice: Math.max(0, Math.round(Number(b.optPrice) || 0)), priceNote: text(b.priceNote, 200), ruEnabled: !!b.ruEnabled };
    DLV.forEach(function (k) { st.dlv[k] = !!(b.dlv && b.dlv[k]); });
    if (!st.pay.card && !st.pay.cod && !st.pay.iban) fail(400, 'Залиште хоча б один спосіб оплати');
    if (!DLV.some(function (k) { return st.dlv[k]; })) fail(400, 'Залиште хоча б один спосіб доставки');
    db.settings = st; save(); return st;
  }
  if (method === 'POST' && url === '/api/admin/products') {
    var pname = text(b.name, 80); if (!pname) fail(400, 'Вкажіть назву товару');
    var nv = variantFrom(b.variant || {});
    var np = { id: 'p-' + Math.random().toString(36).slice(2, 7), cat: ['dry', 'liquid', 'worms', 'other'].indexOf(b.cat) >= 0 ? b.cat : 'other', art: ['bag', 'bottle', 'worms', 'bigbag'].indexOf(b.art) >= 0 ? b.art : 'bag',
      name: pname, tagline: text(b.tagline, 140), description: '', name_ru: '', tagline_ru: '', description_ru: '', variants: [] };
    nv.id = np.id + '-' + Math.random().toString(36).slice(2, 5); np.variants.push(nv); db.products.push(np); save();
    return { id: np.id, catalog: catalog() };
  }
  if (method === 'DELETE' && (m = url.match(/^\/api\/admin\/products\/([\w-]+)$/))) {
    var before = db.products.length; db.products = db.products.filter(function (x) { return x.id !== m[1]; }); delete db.photos[m[1]];
    if (db.products.length === before) fail(404, 'Товар не знайдено'); save(); return { catalog: catalog() };
  }
  if (method === 'POST' && (m = url.match(/^\/api\/admin\/products\/([\w-]+)\/variants$/))) {
    var tp = db.products.filter(function (x) { return x.id === m[1]; })[0]; if (!tp) fail(404, 'Товар не знайдено');
    var av = variantFrom(b); av.id = tp.id + '-' + Math.random().toString(36).slice(2, 5); tp.variants.push(av); save(); return { catalog: catalog() };
  }
  if (method === 'DELETE' && (m = url.match(/^\/api\/admin\/variants\/([\w-]+)$/))) {
    var dv = findV(m[1]); if (!dv) fail(404, 'Фасування не знайдено');
    if (dv.p.variants.length <= 1) fail(400, 'Це єдине фасування товару. Щоб прибрати товар, видаліть його повністю.');
    dv.p.variants = dv.p.variants.filter(function (x) { return x.id !== m[1]; }); save(); return { catalog: catalog() };
  }

  if (method === 'PATCH' && (m = url.match(/^\/api\/admin\/orders\/(\d+)$/))) {
    var o = db.orders.filter(function (x) { return x.no === Number(m[1]); })[0];
    if (!o) fail(404, 'Замовлення не знайдено');
    if (b.status !== undefined) { if (!EG.STATUS[b.status]) fail(400, 'Невідомий статус'); o.status = b.status; }
    if (b.paid !== undefined) o.paid = !!b.paid;
    save(); return o;
  }
  if (method === 'PATCH' && (m = url.match(/^\/api\/admin\/products\/([\w-]+)$/))) {
    var p = db.products.filter(function (x) { return x.id === m[1]; })[0];
    if (!p) fail(404, 'Товар не знайдено');
    var name = text(b.name, 80);
    if (!name) fail(400, 'Назва товару не може бути порожньою');
    p.name = name; p.tagline = text(b.tagline, 140); p.description = String(b.description || '').trim().slice(0, 1500);
    p.name_ru = text(b.name_ru, 80); p.tagline_ru = text(b.tagline_ru, 140); p.description_ru = String(b.description_ru || '').trim().slice(0, 1500);
    if (['dry', 'liquid', 'worms', 'other'].indexOf(b.cat) >= 0) p.cat = b.cat;
    if (['bag', 'bottle', 'worms', 'bigbag'].indexOf(b.art) >= 0) p.art = b.art;
    save(); return { ok: true };
  }
  if (method === 'PATCH' && (m = url.match(/^\/api\/admin\/variants\/([\w-]+)$/))) {
    var f = findV(m[1]);
    if (!f) fail(404, 'Фасування не знайдено');
    if (b.price !== undefined) {
      var price = Math.round(Number(b.price));
      if (!(price >= 1 && price <= 1000000)) fail(400, 'Ціна має бути від 1 до 1 000 000 грн');
      f.v.price = price;
    }
    if (b.stock !== undefined) { if (!EG.STOCK[b.stock]) fail(400, 'Невідома наявність'); f.v.stock = b.stock; }
    if (b.label !== undefined) { var lv = variantFrom({ label: b.label, unit: b.unit, amount: b.amount, price: f.v.price }); f.v.label = lv.label; f.v.short = null; f.v.kg = lv.kg; f.v.liters = lv.liters; f.v.pcs = lv.pcs; }
    save();
    var out = clone(f.v); out.product_name = f.p.name; return out;
  }
  if (method === 'POST' && url === '/api/admin/photos') {
    var owner = text(b.owner, 40);
    if (owner !== 'opt' && !db.products.some(function (x) { return x.id === owner; })) fail(400, 'Товар не знайдено');
    var list = db.photos[owner] = db.photos[owner] || [];
    if (list.length >= MAX_PHOTOS) fail(400, 'Максимум ' + MAX_PHOTOS + ' фото на товар');
    if (!/^data:image\/jpeg;base64,/.test(b.data || '')) fail(400, 'Файл не схожий на фото JPEG');
    list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), url: b.data });
    if (!save()) { list.pop(); fail(507, 'У браузері забракло місця для фото макета. Видаліть зайві фото. На справжньому сайті фото зберігаються на сервері.'); }
    return { owner: owner, photos: list };
  }
  if ((m = url.match(/^\/api\/admin\/photos\/([\w-]+)(\/main)?$/))) {
    for (var key in db.photos) {
      var arr = db.photos[key];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id !== m[1]) continue;
        var ph = arr.splice(i, 1)[0];
        if (method === 'POST' && m[2]) arr.unshift(ph); else if (method !== 'DELETE') fail(404, 'Не знайдено');
        save(); return { owner: key, photos: arr };
      }
    }
    fail(404, 'Фото не знайдено');
  }
  fail(404, 'Не знайдено');
}

EG.api = function (method, url, body) {
  return new Promise(function (resolve, reject) {
    setTimeout(function () {
      try { resolve(clone(handle(method, url.split('?')[0], body || {}))); }
      catch (e) {
        if (e.status) { reject(e); return; }
        var err = new Error('Помилка макета: ' + e.message); err.status = 500; reject(err);
      }
    }, 120);
  });
};

window.MAKET_DB = {
  tg: function () { return load().tg.slice().reverse(); },
  storageOk: storageOk,
  reset: function () {
    var keep = load().photos;
    db = fresh(); db.photos = keep; save();
    ['eg-cart-v1', 'eg-sel-v1', 'eg-buyer-v1'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
  }
};
})();

</script>
<script>
/* Ecogreen shop: renders pages from the catalog API, keeps the cart in the browser, sends orders to the server.
   Texts are Ukrainian; T('...') swaps them for Russian from public/i18n.js when the RU version is on. */
(function () {
'use strict';
var EG = window.EG, esc = EG.esc, money = EG.money, I = EG.I;
var LS_CART = 'eg-cart-v1', LS_SEL = 'eg-sel-v1', LS_BUYER = 'eg-buyer-v1', LS_LANG = 'eg-lang', SS_LAST = 'eg-last-order';

var CAT = null; // { products, opt, settings, payment } from /api/catalog
var cart = EG.load(LS_CART, []); if (!Array.isArray(cart)) cart = [];
var sel = EG.load(LS_SEL, {});
var UI = { page: 'home', pid: null, ppQty: 1, ppPhoto: 0, menu: false, cat: 'all', useTab: 'dry', draft: null, errors: {},
  formError: '', sending: false, loadError: '', leadSent: null, leadError: '', leadSending: false, lastOrder: null,
  paying: false, checking: false, lang: EG.load(LS_LANG, 'uk') };
try { UI.lastOrder = JSON.parse(sessionStorage.getItem(SS_LAST) || 'null'); } catch (e) { /* ignore */ }
var app = document.getElementById('app');
// The demo mockup (maket.html) keeps the current page in memory instead of the address bar.
var nav = window.EG_NAV || {
  path: function () { return location.pathname; },
  hash: function () { return location.hash.slice(1); },
  query: function (k) { return new URLSearchParams(location.search).get(k); },
  push: function (url) { if (url !== location.pathname + location.hash) history.pushState(null, '', url); }
};
function active() { return !window.EG_MODE || window.EG_MODE === 'shop'; }

/* language */
function lang() { return CAT && CAT.settings && CAT.settings.ruEnabled && UI.lang === 'ru' ? 'ru' : 'uk'; }
function T(s, vars) {
  var out = (lang() === 'ru' && window.I18N && window.I18N.ru[s]) || s;
  if (vars) for (var k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}
function C() { // site texts from content.js, with Russian overrides when needed
  var base = window.CONTENT;
  if (lang() !== 'ru' || !base.RU) return base;
  var out = {};
  for (var k in base) out[k] = base[k];
  for (var r in base.RU) out[r] = base.RU[r];
  out.CONTACTS = {};
  for (var c1 in base.CONTACTS) out.CONTACTS[c1] = base.CONTACTS[c1];
  for (var c2 in (base.RU.CONTACTS || {})) out.CONTACTS[c2] = base.RU.CONTACTS[c2];
  return out;
}
function pName(p) { return (lang() === 'ru' && p.name_ru) || p.name; }
function pTagline(p) { return (lang() === 'ru' && p.tagline_ru) || p.tagline; }
function pDesc(p) { return (lang() === 'ru' && p.description_ru) || p.description; }
function stockPill(s) { return EG.pill(s, T(EG.STOCK[s])); }
function money0(n) { return lang() === 'ru' ? Math.round(n).toLocaleString('uk-UA') + ' грн' : money(n); }

/* settings helpers */
function S() { return (CAT && CAT.settings) || { pay: { card: false, cod: false, iban: true }, dlv: { np: true, npc: false, ukr: false, local: true, self: true }, minOrder: 0, freeDeliveryFrom: 0, optPrice: 0 }; }
function optPriceText() { var p = S().optPrice; return p > 0 ? T('від {p} грн/кг', { p: p }) : T('Ціна за запитом'); }
function onlinePay() { return CAT && CAT.payment && CAT.payment.provider !== 'manual'; }
function dlvOn() { return Object.keys(EG.DLV).filter(function (k) { return S().dlv[k]; }); }
function payOn() { return Object.keys(EG.PAY).filter(function (k) { return S().pay[k]; }); }
// enabled payment methods in short words: "карткою онлайн, при отриманні або переказом на рахунок"
function payWords() {
  var names = { card: 'карткою онлайн', cod: 'при отриманні', iban: 'переказом на рахунок' };
  var w = payOn().map(function (k) { return T(names[k]); });
  return w.length > 1 ? w.slice(0, -1).join(', ') + ' ' + T('або') + ' ' + w[w.length - 1] : (w[0] || '');
}

/* data helpers */
function getP(id) { return CAT ? CAT.products.filter(function (p) { return p.id === id; })[0] : null; }
function findV(vid) {
  if (!CAT) return null;
  for (var i = 0; i < CAT.products.length; i++) {
    var p = CAT.products[i];
    for (var j = 0; j < p.variants.length; j++) if (p.variants[j].id === vid) return { p: p, v: p.variants[j] };
  }
  return null;
}
function selV(p) { return p.variants.filter(function (v) { return v.id === sel[p.id]; })[0] || p.variants[0]; }
function saveCart() { EG.save(LS_CART, cart); }
function cartLines() {
  return cart.map(function (l) { var f = findV(l.vid); return f ? { vid: l.vid, qty: l.qty, p: f.p, v: f.v, sum: f.v.price * l.qty } : null; }).filter(Boolean);
}
function cartCount() { return cart.reduce(function (a, l) { return a + l.qty; }, 0); }
function cartTotal() { return cartLines().reduce(function (a, l) { return a + l.sum; }, 0); }
function addCart(vid, q) {
  var l = cart.filter(function (x) { return x.vid === vid; })[0];
  if (l) l.qty = Math.min(99, l.qty + q); else cart.push({ vid: vid, qty: q });
  saveCart();
}
function pruneCart() { // drop items that disappeared from the catalog
  var before = cart.length;
  cart = cart.filter(function (l) { return findV(l.vid) && l.qty >= 1; });
  if (cart.length !== before) saveCart();
}
function unitPrice(v) {
  if (v.kg) return T('{p} за кг', { p: money0(v.price / v.kg) });
  if (v.liters) return T('{p} за літр', { p: money0(v.price / v.liters) });
  if (v.pcs) return T('{p} за 100 шт', { p: money0(v.price / v.pcs * 100) });
  return '';
}
function dText(o) { return o.dlv === 'self' ? T('Самовивіз') : T(EG.DLV[o.dlv]) + ': ' + o.city + ', ' + o.branch; }

/* layout */
function header() {
  var n = cartCount();
  var cur = function (p) { return UI.page === p ? ' aria-current="page"' : ''; };
  var langBtn = S().ruEnabled
    ? '<button class="icon-btn" data-act="lang" aria-label="' + (lang() === 'ru' ? 'Українська версія' : 'Русская версия') + '">' + (lang() === 'ru' ? 'UA' : 'RU') + '</button>'
    : '';
  return '<header class="hdr"><div class="wrap hdr-in">' +
    '<a class="logo" href="/" data-nav>' + EG.BRAND + '</a>' +
    '<nav class="nav' + (UI.menu ? ' open' : '') + '" aria-label="' + T('Основне меню') + '">' +
      '<a href="/catalog" data-nav' + cur('catalog') + '>' + T('Каталог') + '</a>' +
      '<a href="/#use" data-nav>' + T('Як застосовувати') + '</a>' +
      '<a href="/opt" data-nav' + cur('opt') + '>' + T('Оптом') + '</a>' +
      '<a href="/#delivery" data-nav>' + T('Доставка й оплата') + '</a>' +
      '<a href="/#contacts" data-nav>' + T('Контакти') + '</a>' +
    '</nav>' +
    '<div class="hdr-act">' + langBtn + themeBtn() +
      '<a class="icon-btn" href="/cart" data-nav aria-label="' + T('Кошик, товарів: {n}', { n: n }) + '">' + I.cart + '<span class="hide-sm">' + T('Кошик') + '</span>' + (n ? '<b class="badge">' + n + '</b>' : '') + '</a>' +
      '<button class="icon-btn menu-btn" data-act="menu" aria-expanded="' + UI.menu + '" aria-label="' + T('Меню') + '">' + I.menu + '</button>' +
    '</div></div></header>';
}
function themeBtn() {
  var d = EG.curTheme() === 'dark';
  return '<button class="icon-btn" data-act="theme" aria-label="' + T(d ? 'Увімкнути світлу тему' : 'Увімкнути темну тему') + '">' +
    (d ? I.sun : I.moon) + '<span class="hide-sm">' + T(d ? 'Світла' : 'Темна') + '</span></button>';
}
function footer() {
  var c = C().CONTACTS;
  return '<footer class="foot" id="contacts"><div class="wrap"><div class="foot-grid">' +
    '<div class="foot-brand"><a class="logo" href="/" data-nav>' + EG.BRAND + '</a><p>' + T('Біогумус від виробника. Сухий і рідкий біогумус, живі черв’яки, опт від 1 тонни.') + '</p></div>' +
    '<div><h4>' + T('Контакти') + '</h4><ul>' +
      (c.phones || []).map(function (p) { return '<li class="ph"><a href="tel:+' + esc(EG.digits(p[0])) + '">' + esc(p[0]) + '</a> ' + esc(p[1]) + '</li>'; }).join('') +
      (c.phones && c.phones.length ? '<li>' + esc(c.messengers) + '</li>' : '') +
      (c.address ? '<li>' + esc(c.address) + '</li>' : '') +
      (c.email ? '<li><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a></li>' : '') +
      '<li><a href="https://www.instagram.com/' + esc(c.instagram) + '/" target="_blank" rel="noopener">Instagram @' + esc(c.instagram) + '</a></li></ul></div>' +
    '<div><h4>' + T('Покупцям') + '</h4><ul><li><a href="/catalog" data-nav>' + T('Каталог') + '</a></li><li><a href="/#use" data-nav>' + T('Як застосовувати') + '</a></li><li><a href="/#delivery" data-nav>' + T('Доставка й оплата') + '</a></li><li><a href="/opt" data-nav>' + T('Оптом') + '</a></li></ul></div>' +
    '<div><h4>' + T('Документи') + '</h4><ul><li><a href="/offer" data-nav>' + T('Публічна оферта') + '</a></li><li><a href="/privacy" data-nav>' + T('Політика конфіденційності') + '</a></li><li><a href="/#faq" data-nav>' + T('Часті питання') + '</a></li></ul></div>' +
  '</div><div class="foot-bottom"><span>© ' + new Date().getFullYear() + ' ' + esc(c.company || 'Ecogreen') + '. ' + T('Біогумус від виробника, Україна.') + '</span></div></div></footer>';
}

/* shared blocks */
function chips(p, v) {
  return '<div class="chips" role="group" aria-label="' + T('Фасування') + '">' + p.variants.map(function (x) {
    return '<button class="chip" data-act="sel" data-p="' + esc(p.id) + '" data-v="' + esc(x.id) + '" aria-pressed="' + (x.id === v.id) + '">' + esc(x.label) + '</button>';
  }).join('') + '</div>';
}
function productCard(p) {
  var v = selV(p), href = '/product/' + encodeURIComponent(p.id);

    '<h3><a href="' + href + '" data-nav>' + esc(pName(p)) + '</a></h3><p class="muted">' + esc(pTagline(p)) + '</p>' + chips(p, v) +
    '<div class="pcard-buy"><span class="price">' + money0(v.price) + '</span><button class="btn btn-sm" data-act="add" data-v="' + esc(v.id) + '"' + (v.stock === 'out' ? ' disabled' : '') + '>' + T('В кошик') + '</button></div></div></article>';
}
function optCard() {
  return '<article class="pcard"><a class="pcard-art" href="/opt" data-nav aria-label="' + T('Біогумус оптом') + '">' + EG.visual(CAT.opt.photos, 'bigbag', '1 т', T('Біогумус сухий оптом, біг-бег')) + '</a><div class="pcard-body">' + EG.pill('muted', T('За заявкою')) +
    '<h3><a href="/opt" data-nav>' + T('Біогумус сухий оптом') + '</a></h3><p class="muted">' + T('Біг-беги від 1 т для фермерів, теплиць і магазинів') + '</p>' +
    '<div class="pcard-buy"><span class="price price-sm">' + optPriceText() + '</span><a class="btn btn-sm btn-ghost" href="/opt" data-nav>' + T('Заявка') + '</a></div></div></article>';
}
function grid(list, withOpt) { return '<div class="pgrid">' + list.map(productCard).join('') + (withOpt ? optCard() : '') + '</div>'; }
function useTable(kind) {
  return '<div class="tbl-wrap"><table><thead><tr><th>' + T('Культура') + '</th><th>' + T('Норма') + '</th><th>' + T('Коли') + '</th></tr></thead><tbody>' +
    (C().USE[kind] || []).map(function (r) { return '<tr><td class="t-main">' + esc(r[0]) + '</td><td class="nrm" data-label="' + T('Норма') + '">' + esc(r[1]) + '</td><td data-label="' + T('Коли') + '">' + esc(r[2]) + '</td></tr>'; }).join('') +
    '</tbody></table></div>';

/* routing: real URLs (/catalog, /product/dry) so links can be shared and indexed */
var TITLES = { home: 'Біогумус від виробника', catalog: 'Каталог', cart: 'Кошик', checkout: 'Оформлення замовлення',
  done: 'Замовлення прийнято', opt: 'Біогумус оптом від 1 т', notfound: 'Сторінку не знайдено', offer: 'Публічна оферта', privacy: 'Політика конфіденційності' };
function route(path) {
  var m = path.match(/^\/product\/([\w-]+)\/?$/);
  if (m) {
    if (UI.pid !== m[1]) { UI.ppQty = 1; UI.ppPhoto = 0; }
    UI.page = 'product'; UI.pid = m[1];
    return;
  }
  var map = { '/': 'home', '/catalog': 'catalog', '/cart': 'cart', '/checkout': 'checkout', '/done': 'done', '/opt': 'opt', '/offer': 'offer', '/privacy': 'privacy' };
  UI.page = map[path.replace(/(.)\/$/, '$1')] || 'notfound';
  if (UI.page !== 'checkout') { UI.errors = {}; UI.formError = ''; }
}
function page() {
  if (!CAT) return pLoading();
  switch (UI.page) {
    case 'catalog': return pCatalog();
    case 'product': return pProduct();
    case 'cart': return pCart();
    case 'checkout': return pCheckout();
    case 'done': return pDone();
    case 'opt': return pOpt();
    case 'notfound': return pNotFound();
    case 'offer': case 'privacy': return pLegal(UI.page);
    default: return pHome();
  }
}
function render() {
  document.documentElement.lang = lang();
  app.innerHTML = header() + '<main id="main">' + page() + '</main>' + footer();
  var p = UI.page === 'product' && getP(UI.pid);
  document.title = (p ? pName(p) : T(TITLES[UI.page] || TITLES.home)) + ' | Ecogreen';
}
function scrollToAnchor(anchor) {
  requestAnimationFrame(function () {
    var el = anchor && document.getElementById(anchor);
    if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  });
}
function go(href) {
  var u = new URL(href, 'https://site.invalid'); // only the path and #anchor are used; a fixed base also works inside the mockup
  UI.menu = false;
  nav.push(u.pathname + u.hash);
  route(u.pathname);
  render();
  scrollToAnchor(u.hash.slice(1));
}

/* payment status after returning from the bank */
function saveLast(o) {
  UI.lastOrder = o;
  try { sessionStorage.setItem(SS_LAST, JSON.stringify(o)); } catch (e) { /* ignore */ }
}
function refreshOrder(no, token, tries) {
  if (!no || !token) return;
  UI.checking = true;
  EG.api('GET', '/api/orders/' + encodeURIComponent(no) + '?t=' + encodeURIComponent(token)).then(function (o) {
    saveLast(o);
    UI.checking = false;
    if (UI.page === 'done') render();
    // the bank's notification can come a few seconds after the buyer is back
    if (!o.paid && o.pay === 'card' && onlinePay() && tries > 0) setTimeout(function () { refreshOrder(no, token, tries - 1); }, 4000);
  }).catch(function () { UI.checking = false; if (UI.page === 'done') render(); });
}
function payNow() {
  var o = UI.lastOrder;
  if (!o || UI.paying) return;
  UI.paying = true; render();
  EG.api('POST', '/api/orders/' + encodeURIComponent(o.no) + '/pay', { t: o.token }).then(function (r) {
    window.location.href = r.payUrl;
  }).catch(function (err) { UI.paying = false; render(); EG.toast(err.message); });
}

/* events */
document.addEventListener('click', function (e) {
  if (!active()) return;
  var a = e.target.closest('a[data-nav]');
  if (a) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    go(a.getAttribute('href'));
    return;
  }
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var ds = b.dataset, f, l;
  switch (ds.act) {
    case 'menu': UI.menu = !UI.menu; render(); break;
    case 'theme': EG.toggleTheme(); render(); break;
    case 'lang': UI.lang = lang() === 'ru' ? 'uk' : 'ru'; EG.save(LS_LANG, UI.lang); render(); break;
    case 'reload': UI.loadError = ''; render(); loadCatalog(); break;
    case 'sel': sel[ds.p] = ds.v; EG.save(LS_SEL, sel); render(); break;
    case 'add':
      f = findV(ds.v);
      if (!f || f.v.stock === 'out') return;
      addCart(f.v.id, ds.q === 'pp' ? UI.ppQty : 1);
      render();
      EG.toast(T('Додано в кошик: {item}', { item: pName(f.p) + ', ' + f.v.label }), T('Відкрити кошик'), function () { go('/cart'); });
      break;
    case 'pqty': UI.ppQty = Math.max(1, Math.min(99, UI.ppQty + Number(ds.d))); render(); break;
    case 'ppphoto': UI.ppPhoto = Number(ds.i); render(); break;
    case 'qty':
      l = cart.filter(function (x) { return x.vid === ds.v; })[0];
      if (l) { l.qty = Math.max(1, Math.min(99, l.qty + Number(ds.d))); saveCart(); render(); }
      break;
    case 'rm': cart = cart.filter(function (x) { return x.vid !== ds.v; }); saveCart(); render(); break;
    case 'filter': UI.cat = ds.k; render(); break;
    case 'usetab': UI.useTab = ds.k; render(); break;
    case 'lead-again': UI.leadSent = null; render(); break;
    case 'pay': payNow(); break;
    case 'recheck': if (UI.lastOrder) { refreshOrder(UI.lastOrder.no, UI.lastOrder.token, 0); render(); } break;
  }
});
document.addEventListener('input', function (e) {
  if (!active()) return;
  var t = e.target;
  if (t.form && t.form.id === 'fCheckout' && t.name) draft()[t.name] = t.value;
});
document.addEventListener('change', function (e) {
  if (!active()) return;
  var t = e.target;
  if (!(t.form && t.form.id === 'fCheckout')) return;
  if (t.name) draft()[t.name] = t.value;
  if (t.name === 'dlv') {
    document.getElementById('addr').hidden = t.value === 'self';
    document.getElementById('self-note').hidden = t.value !== 'self';
    var lab = document.getElementById('branch-label');
    if (lab) lab.textContent = T(BR_LABEL[t.value] || '');
  }
  if (t.name === 'pay') render(); // the button text depends on the payment method
});
function validate(d) {
  var e = {};
  if (!d.name.trim()) e.name = 'Вкажіть ім’я та прізвище';
  if (EG.digits(d.phone).length < 10) e.phone = 'Вкажіть номер у форматі +380 XX XXX XX XX';
  if (d.dlv !== 'self') {
    if (!d.city.trim()) e.city = 'Вкажіть місто';
    if (!d.branch.trim()) e.branch = d.dlv === 'np' ? 'Вкажіть номер відділення або поштомату' : 'Вкажіть адресу';
  }
  return e;
}
function focusFirstError() { var el = document.querySelector('[aria-invalid="true"]'); if (el) el.focus(); }
document.addEventListener('submit', function (e) {
  if (!active()) return;
  var f = e.target;
  e.preventDefault();
  var fd = {};
  new FormData(f).forEach(function (v, k) { fd[k] = v; });
  if (f.id === 'fCheckout') submitOrder(fd);
  else if (f.id === 'fLead') submitLead(fd);
});
function submitOrder(fd) {
  if (UI.sending) return;
  var d = draft();
  ['name', 'phone', 'dlv', 'city', 'branch', 'pay', 'comment'].forEach(function (k) { if (fd[k] !== undefined) d[k] = fd[k]; });
  UI.errors = validate(d); UI.formError = '';
  if (Object.keys(UI.errors).length) { render(); focusFirstError(); return; }
  UI.sending = true; render();
  EG.api('POST', '/api/orders', { name: d.name, phone: d.phone, dlv: d.dlv, city: d.city, branch: d.branch, pay: d.pay, comment: d.comment, items: cart })
    .then(function (order) {
      UI.sending = false;
      EG.save(LS_BUYER, { name: d.name, phone: d.phone, dlv: d.dlv, city: d.city, branch: d.branch });
      cart = []; saveCart(); UI.draft = null;
      saveLast(order);
      if (order.payUrl) { window.location.href = order.payUrl; return; } // to the bank's payment page
      go('/done');
      if (order.payError) EG.toast(T('Не вдалося відкрити оплату. Спробуйте кнопку «Оплатити» або дочекайтесь дзвінка менеджера.'));
    })
    .catch(function (err) {
      UI.sending = false;
      UI.errors = err.fields || {};
      UI.formError = err.message;
      if (err.code === 'stale' || err.code === 'out' || err.status === 400) loadCatalog();
      render(); focusFirstError();
    });
}
function submitLead(fd) {
  if (UI.leadSending) return;
  var name = (fd.name || '').trim(), phone = (fd.phone || '').trim();
  if (!name || EG.digits(phone).length < 10) {
    UI.leadError = T('Вкажіть ім’я і телефон, щоб менеджер міг з вами зв’язатися.');
    render(); return;
  }
  UI.leadSending = true; UI.leadError = ''; render();
  EG.api('POST', '/api/leads', { name: name, phone: phone, volume: fd.volume, region: fd.region, comment: fd.comment })
    .then(function (lead) { UI.leadSending = false; UI.leadSent = lead; render(); scrollToAnchor('optblock'); })
    .catch(function (err) { UI.leadSending = false; UI.leadError = err.message; render(); });
}
window.addEventListener('popstate', function () { route(location.pathname); render(); scrollToAnchor(location.hash.slice(1)); });

  return EG.api('GET', '/api/catalog').then(function (c) {

    if (!CAT) { UI.loadError = err.message; render(); }

function start() {

  return loadCatalog().then(function () {
    if (nav.hash()) scrollToAnchor(nav.hash());
    // back from the bank: /done?no=1001&t=...
    var no = nav.query && nav.query('no'), t = nav.query && nav.query('t');
    if (UI.page === 'done' && no && t) refreshOrder(no, t, 5);
    else if (UI.page === 'done' && UI.lastOrder && UI.lastOrder.pay === 'card' && !UI.lastOrder.paid) refreshOrder(UI.lastOrder.no, UI.lastOrder.token, 0);
  });
}
if (window.EG_MOCK) window.EG_SHOP = { start: start, go: go }; else start();
})();

</script>
<script>
/* Ecogreen admin panel: orders, products and packaging, prices, stock, photos, wholesale leads, shop settings. */
(function () {

var UI = { state: 'loading', tab: 'orders', error: '', loginError: '', loggingIn: false, confirm: null, busy: {}, addProduct: false };
var app = document.getElementById('app');
// In the demo mockup the shop and the admin share one page; only the active one reacts to events.

function header() {

}

function loginView() {

    '<div class="field"><label for="a-pass">Пароль</label><input class="inp" id="a-pass" name="password" type="password" autocomplete="current-password"' + (UI.loginError ? ' aria-invalid="true"' : '') + '>' +

}

/* small form helpers */
function opts(map, current) {
  return Object.keys(map).map(function (k) { return '<option value="' + k + '"' + (k === current ? ' selected' : '') + '>' + map[k] + '</option>'; }).join('');
}
function unitOf(v) { return v.kg ? 'kg' : v.liters ? 'l' : v.pcs ? 'pcs' : ''; }
function amountOf(v) { return v.kg || v.liters || v.pcs || ''; }
function confirmBox(key, question, yesAct, id) {
  return UI.confirm === key
    ? '<span class="inline-confirm">' + question + ' <button class="btn btn-sm btn-danger" data-act="' + yesAct + '" data-id="' + esc(id) + '">Так</button><button class="btn btn-sm btn-ghost" data-act="cancel">Ні</button></span>'

function ordersView() {

  return '<div class="tbl-wrap adm-orders"><table><thead><tr><th>№</th><th>Дата</th><th>Клієнт</th><th>Товари</th><th>Сума</th><th>Оплата</th><th>Доставка</th><th>Статус</th></tr></thead><tbody>' +
    D.orders.map(function (o) {

      return '<tr><td class="num t-main"><b>№' + o.no + '</b></td><td class="num" data-label="Дата">' + EG.fmtDate(o.created_at) + '</td>' +
        '<td data-label="Клієнт"><div>' + esc(o.name) + '<br><a class="adm-small num" href="tel:' + esc(EG.digits(o.phone)) + '">' + esc(o.phone) + '</a></div></td>' +
        '<td class="adm-small" data-label="Товари"><div>' + o.items.map(function (l) { return esc(l.name) + ', ' + esc(l.label) + ' × ' + l.qty; }).join('<br>') + (o.comment ? '<br><i>' + esc(o.comment) + '</i>' : '') + '</div></td>' +
        '<td class="num" data-label="Сума"><b>' + money(o.total) + '</b></td>' +

    }).join('') + '</tbody></table></div>';

        '<button class="ph-btn" data-act="ph-del" data-id="' + esc(x.id) + '" aria-label="Видалити фото ' + (i + 1) + '" title="Видалити">' + I.x + '</button></div>' +
        (UI.confirm === 'ph:' + x.id ? '<div class="ph-confirm"><span>Видалити фото?</span><div class="row"><button class="yes" data-act="ph-del-yes" data-id="' + esc(x.id) + '">Так</button><button data-act="cancel">Ні</button></div></div>' : '') +
        '</figure>';
    }).join('') +
    (photos.length < MAXPH ? '<label class="ph-add"><input type="file" class="sr-only" accept="image/*" multiple data-upload="' + esc(owner) + '"><span>' + (busy ? 'Завантажуємо…' : '+ Додати фото') + '</span><small>або перетягніть сюди</small></label>' : '') +
  '</div><p class="note">JPG, PNG або WebP, до ' + MAXPH + ' фото. Великі фото стискаються автоматично.</p></div>';

function variantRow(p, v) {
  var key = 'v:' + v.id;
  return '<tr data-vrow="' + esc(v.id) + '">' +
    '<td data-label="Фасування"><input class="inp inp-sm" data-vedit="label" value="' + esc(v.label) + '" maxlength="40" aria-label="Назва фасування"></td>' +
    '<td data-label="За одиницю"><div class="unit-pair"><input class="inp inp-sm" data-vedit="amount" type="number" min="0" step="any" inputmode="decimal" value="' + esc(amountOf(v)) + '" aria-label="Кількість"><select class="inp inp-sm" data-vedit="unit" aria-label="Одиниця">' + opts(UNITS, unitOf(v)) + '</select></div></td>' +
    '<td data-label="Ціна, грн"><input class="inp inp-sm num" type="number" min="1" step="1" inputmode="numeric" value="' + v.price + '" data-price="' + esc(v.id) + '" aria-label="Ціна: ' + esc(p.name) + ', ' + esc(v.label) + '"></td>' +
    '<td data-label="Наявність"><select class="inp inp-sm" data-stock="' + esc(v.id) + '" aria-label="Наявність: ' + esc(p.name) + ', ' + esc(v.label) + '">' + opts(EG.STOCK, v.stock) + '</select></td>' +
    '<td class="td-act">' + (p.variants.length > 1
      ? (UI.confirm === key ? confirmBox(key, 'Видалити?', 'vdel-yes', v.id) : '<button class="rm" data-act="vdel" data-id="' + esc(v.id) + '" aria-label="Видалити фасування ' + esc(v.label) + '" title="Видалити фасування">' + I.x + '</button>')
      : '') + '</td></tr>';

function productBlock(p) {
  var pid = esc(p.id), key = 'p:' + p.id;
  return '<section class="adm-prod"><div class="adm-prod-head"><h2 class="h3">' + esc(p.name) + '</h2><div class="cta-row">' +

        '<input class="inp inp-sm" name="amount" type="number" min="0" step="any" placeholder="К-сть" aria-label="Кількість"><select class="inp inp-sm" name="unit" aria-label="Одиниця">' + opts(UNITS, '') + '</select>' +
        '<input class="inp inp-sm" name="price" type="number" min="1" step="1" placeholder="Ціна" aria-label="Ціна"><button class="btn btn-sm" type="submit">+ Додати</button></form>' +

    '</div>' +
    '<form class="prod-form" data-prod="' + pid + '"><div class="row2"><div class="field"><label for="pn-' + pid + '">Назва</label><input class="inp" id="pn-' + pid + '" name="name" maxlength="80" value="' + esc(p.name) + '"></div>' +
      '<div class="field"><label for="pt-' + pid + '">Коротко (у картці каталогу)</label><input class="inp" id="pt-' + pid + '" name="tagline" maxlength="140" value="' + esc(p.tagline) + '"></div></div>' +

function addProductForm() {

    '<div class="cta-row"><button class="btn" type="submit">Створити товар</button><button class="btn btn-ghost" type="button" data-act="add-product-cancel">Скасувати</button></div></form>';

function productsView() {
  var c = D.catalog;
  return addProductForm() + c.products.map(productBlock).join('') +
    '<section class="adm-prod"><div class="adm-prod-head"><h2 class="h3">Біогумус сухий оптом</h2><span class="tag">ціна за запитом</span></div><div class="adm-prod-grid">' + phManager('opt', 'біг-бег', c.opt.photos) +
    '<p class="muted">Фото для картки «Оптом» у каталозі, наприклад біг-беги на складі. Заявки від оптовиків у вкладці «Оптові заявки».</p></div></section>';
}

function leadsView() {
  if (!D.leads.length) return '<div class="empty"><p>Оптових заявок ще немає.</p></div>';
  return '<div class="tbl-wrap"><table><thead><tr><th>Хто</th><th>Дата</th><th>Телефон</th><th>Обсяг</th><th>Регіон</th><th>Коментар</th></tr></thead><tbody>' +
    D.leads.map(function (l) {
      return '<tr><td class="t-main">' + esc(l.name) + '</td><td class="num" data-label="Дата">' + EG.fmtDate(l.created_at) + '</td><td class="num" data-label="Телефон"><a href="tel:' + esc(EG.digits(l.phone)) + '">' + esc(l.phone) + '</a></td>' +
        '<td data-label="Обсяг"><b>' + esc(l.volume) + '</b></td><td data-label="Регіон">' + esc(l.region) + '</td><td class="adm-small" data-label="Коментар">' + esc(l.comment) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
